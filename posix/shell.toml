[tests.od]
source = """
echo abcdefghijklmnopqrstuvwxyz > 1
od -t x1 1
"""
output = """
0000000 61 62 63 64 65 66 67 68 69 6a 6b 6c 6d 6e 6f 70
0000020 71 72 73 74 75 76 77 78 79 7a 0a
0000033
"""

