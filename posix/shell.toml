name = "Portable Operating System Interface - Shell and Utilities"
desc = "POSIX.1-2017: https://pubs.opengroup.org/onlinepubs/9699919799/"

#TODO: alias, ar, at, awk

[tests.basename]
source = """
basename /usr/bin
basename /usr/bin in
"""
output = """
bin
b
"""

#TODO: batch, bc

[tests.cat]
source = """
echo two > 2
echo one > 1
cat 1 2
"""
output = """
one
two
"""

#TODO: cd, chgrp, chmod, chown, cksum

