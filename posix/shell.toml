[tests.mv]
source = """
echo one > 1
echo two > 2
mv 1 2
ls -1
cat 2
"""
output = """
2
one
"""

#TODO: newgrp, nice (not on Redox)

[tests.nl]
source = """
echo one > 1
echo two >> 1
echo three >> 1
nl 1
"""
output = """
     1	one
     2	two
     3	three
"""

