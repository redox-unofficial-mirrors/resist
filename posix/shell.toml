name = "Portable Operating System Interface - Shell and Utilities"
desc = "POSIX.1-2017: https://pubs.opengroup.org/onlinepubs/9699919799/"

#TODO: alias, ar, at, awk (not on Redox)

[tests.basename]
source = """
basename /usr/bin
basename /usr/bin in
"""
output = """
bin
b
"""

#TODO: batch, bc (not on Redox)

[tests.cat]
source = """
echo two > 2
echo one > 1
cat 1 2
"""
output = """
one
two
"""

#TODO: cd, chgrp, chmod, chown, cksum (predictable output)

[tests.cmp]
source = """
echo one > 1
echo two > 2
cmp 1 1
cmp 2 2
cmp 1 2 || true
"""
output = """
1 2 differ: byte 1, line 1
"""

#TODO: comm (complicated)

[tests.command]
source = """
command -V echo
"""
output = """
echo is a shell builtin
"""

[tests.cp]
source = """
echo two > 2
echo one > 1
cp 1 3
cp 2 4
cat 3 4
"""
output = """
one
two
"""

#TODO: crontab, csplit (not on Redox)

[tests.cut]
source = """
echo a,b,c,d,e,f,g | cut -d , -f 2,4,6
"""
output = """
b,d,f
"""

#TODO: date (uutils version is odd)

[tests.dd]
source = """
echo one > 1
dd if=1 of=2 bs=1 count=2 2>/dev/null
cat 2
"""
output = "on"

#TODO: df (format is different on Redox)
#TODO: diff (install diffutils on Redox)


[tests.dirname]
source = """
dirname /usr/bin
"""
output = """
/usr
"""

[tests.du]
source = """
dd if=/dev/zero of=1 bs=1024 count=256 2>/dev/null
du 1
"""
output = """
256\t1
"""

[tests.echo]
source = """
echo a b c d
"""
output = """
a b c d
"""

#TODO: ed (the standard editor)

[tests.env]
source = """
env KEY=VALUE printenv KEY
"""
output = """
VALUE
"""

#TODO: ex (interactive program)

[tests.expand]
source = """
echo "test\texpand" | expand
"""
output = """
test    expand
"""

[tests.expr]
source = """
expr 2 + 2
"""
output = """
4
"""

[tests.false]
source = """
false && echo TRUE || echo FALSE
"""
output = """
FALSE
"""

#TODO: fc, fg, file (not on Redox)

[tests.find]
source = """
echo one > 1
echo two > 2
find .
find . -name 2
find . -name 1
"""
output = """
.
./1
./2
./2
./1
"""

[tests.fold]
source = """
echo abcdefghijklmnopqrstuvwxyz | fold -w 3
"""
output = """
abc
def
ghi
jkl
mno
pqr
stu
vwx
yz
"""

#TODO: fuser, gencat, getconf, getopts (not on Redox)

[tests.grep]
source = """
echo one > 1
echo two >> 1
echo three >> 1
grep two 1
grep -v three 1
"""
output = """
two
one
two
"""

[tests.hash]
source = """
hash sh
"""
output = """
"""

