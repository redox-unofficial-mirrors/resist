[tests.printf]
source = """
printf 'printf %d %.1f %c %s\\n' 1 2.0 c str
"""
output = """
printf 1 2.0 c str
"""

#TODO: ps (predictable output)
#TODO: pwd (predictable output)

[tests.read]
source = """
echo one > 1
echo two >> 1
cat 1 | while read line
do
    echo "line: $line"
done
"""
output = """
line: one
line: two
"""

#TOOD: renice (not on Redox)

[tests.rm]
source = """
touch 1 2 3 4
ls -1
rm 1 2
ls -1
rm 4
ls -1
"""
output = """
1
2
3
4
3
4
3
"""

[tests.rmdir]
source = """
mkdir 1 2 3 4
ls -1
rmdir 1 2
ls -1
rmdir 4
ls -1
"""
output = """
1
2
3
4
3
4
3
"""

